name: Module 5

on:
  workflow_call:

jobs:
  test:
    name: Test Module 5
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r module5/requirements.txt

      - name: Run tests
        run: python -m unittest discover -s module5 -p "test_*.py"
