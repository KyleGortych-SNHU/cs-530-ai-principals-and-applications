name: Module 9

on:
  workflow_call:

jobs:
  test:
    name: Test Module 9 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: module9/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r module9/requirements.txt

      - name: Check PEP 8 style
        run: python -m ruff check --select E,F,I --line-length 79 module9

      - name: Check Python formatting
        run: python -m ruff format --check --line-length 79 module9

      - name: Run unit and integration tests
        run: python -m pytest module9/tests
